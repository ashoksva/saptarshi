services:
  stub-llm:
    build:
      context: .
      dockerfile: apps/stub-llm/Dockerfile
    ports:
      - "8001:8001"
    environment:
      STUB_PORT: "8001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_BASE_URL: http://stub-llm:8001/v1
      MODEL_API_KEY: not-needed-for-stub
      MODEL_NAME: saptarshi
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - stub-llm

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
